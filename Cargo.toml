[package]
name = "affnumber"
version = "1.0.1"
edition = "2021"
description = "Affinity Numbers for Hachimi"
license = "MIT"

[lib]
name = "affnumber"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
egui = { version = "0.33.3", default-features = false }

[target.'cfg(windows)'.dependencies]
egui-directx11 = { path = "vendor/egui-directx11" }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
] }
